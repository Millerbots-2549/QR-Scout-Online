<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f5ff">
  <title>Feedback — QR Scout Docs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/millerbot-orange.png">
  <script>
    try {
      if (localStorage.getItem("qr-scout-theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#0c1823";
      }
    } catch (error) {
      console.error("Could not read the theme preference.", error);
    }
  </script>
  <link rel="stylesheet" href="site.css">
  <style>
    .feedback-page { width: min(100% - 32px, 760px); margin: 0 auto; padding: 8px 0 52px; }
    .feedback-card { padding: clamp(20px, 4vw, 32px); border: 1px solid #b8d9ef; border-radius: 16px; background: #fff; }
    .eyebrow { color: #c44d00; font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .15em; }
    h1 { margin: 8px 0; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.055em; }
    .intro { margin: 0 0 22px; color: #58758b; font-size: 13px; line-height: 1.6; }
    .feedback-form { display: grid; gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field label { color: #17364f; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; font-weight: 720; }
    .control { width: 100%; color: #17364f; background: #fff; border: 1px solid #a9cce3; border-radius: 9px; min-height: 42px; padding: 10px 11px; outline: none; font: inherit; font-size: 12px; }
    .control:focus { border-color: #ff7417; box-shadow: 0 0 0 3px rgba(255,116,23,.14); }
    textarea.control { min-height: 140px; resize: vertical; }
    .submit { min-height: 42px; width: fit-content; padding: 0 16px; border: 1px solid #ff7417; border-radius: 9px; background: #ff7417; color: #3b1b06; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; }
    .submit:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 18px; color: #58758b; font-size: 12px; }
    .status.error { color: #b93814; }
    .honeypot { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 620px) { .feedback-page { width: min(100% - 26px, 760px); padding-top: 0; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html">
      <img class="site-brand-mark" src="assets/images/millerbot-orange.png" alt="" aria-hidden="true">
      <span><span class="site-brand-name">QR Scout Docs</span><span class="site-brand-caption" style="display:block">FRC match scouting</span></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="scout.html">Scout</a>
      <a href="guide.html">Guide</a>
      <a href="feedback.html" aria-current="page">Feedback</a>
      <a href="apps.html">Apps</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span>
    </button>
  </header>
  <main class="feedback-page">
    <section class="feedback-card">
      <div class="eyebrow">Help us improve</div>
      <h1>Send feedback</h1>
      <p class="intro">Share a suggestion, report a problem, or tell us how scouting went.</p>
      <form class="feedback-form" id="feedback-form">
        <div class="field"><label for="feedback-name">Name (optional)</label><input class="control" id="feedback-name" name="name" maxlength="100" autocomplete="name" placeholder="Your name"></div>
        <div class="field"><label for="feedback-team">Team number (optional)</label><input class="control" id="feedback-team" name="teamNumber" maxlength="20" inputmode="numeric" placeholder="e.g. 2549"></div>
        <div class="field"><label for="feedback-email">Email (optional)</label><input class="control" id="feedback-email" name="email" type="email" maxlength="200" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label for="feedback-message">Message</label><textarea class="control" id="feedback-message" name="feedback" maxlength="5000" required placeholder="What would you like us to know?"></textarea></div>
        <label class="honeypot" aria-hidden="true">Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label>
        <button class="submit" id="feedback-submit" type="submit">Send feedback</button>
        <div class="status" id="feedback-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script>
    const feedbackForm = document.getElementById("feedback-form");
    const feedbackStatus = document.getElementById("feedback-status");
    feedbackForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!feedbackForm.reportValidity()) return;
      const button = document.getElementById("feedback-submit");
      button.disabled = true;
      feedbackStatus.classList.remove("error");
      feedbackStatus.textContent = "Sending feedback…";
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        let response;
        try {
          response = await fetch("https://qr-scout-online.onrender.com/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(feedbackForm).entries())),
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeout);
        }
        const result = await response.json().catch(() => null);
        if (!response.ok || result?.ok === false) throw new Error(result?.error || "The feedback service could not accept your message.");
        feedbackForm.reset();
        feedbackStatus.textContent = result?.status || "Thanks — your feedback was sent.";
      } catch (error) {
        console.error("Could not submit feedback.", error);
        feedbackStatus.classList.add("error");
        feedbackStatus.textContent = error.name === "AbortError"
          ? "The request timed out. Please try again."
          : error instanceof TypeError
          ? "Could not reach the feedback service. Please try again later."
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
  <script src="site.js"></script>
</body>
</html>
