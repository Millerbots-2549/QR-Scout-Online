  <defs>
    <linearGradient id="qbg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0A0F1F"/>
    </linearGradient>
    <linearGradient id="qaccent" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AA9FF"/>
      <stop offset="1" stop-color="#1B60D6"/>
    </linearGradient>
    <linearGradient id="qmetal" x1="180" y1="140" x2="332" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7B267"/>
      <stop offset="1" stop-color="#F78C2B"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="102" fill="url(#qbg)"/>
  <circle cx="256" cy="246" r="158" fill="url(#qaccent)" opacity="0.18"/>
  <!-- blue clamp ring, echoing the Millerbots C -->
  <path d="M146 268C146 206.655 197.655 155 259 155H321C337.569 155 351 168.431 351 185V193C351 209.569 337.569 223 321 223H259C230.281 223 207 246.281 207 275V304C207 332.719 230.281 356 259 356H321C337.569 356 351 369.431 351 386V394C351 410.569 337.569 424 321 424H259C197.655 424 146 372.345 146 311V268Z" fill="url(#qaccent)"/>
  <!-- white inner ring -->
  <path d="M198 150H279C332.989 150 376 193.011 376 247V254C376 307.989 332.989 351 279 351H198V150Z" fill="none" stroke="#E8F1FF" stroke-width="18" opacity="0.9"/>
  <!-- chef hat -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 252C188 192 214 152 256 152C298 152 324 192 324 252" fill="url(#qmetal)" stroke="#0A0F1F" stroke-width="8"/>
    <path d="M224 168C221 196 221 224 222 250" stroke="#0A0F1F" stroke-width="9" opacity="0.55"/>
    <path d="M256 162L256 250" stroke="#0A0F1F" stroke-width="9" opacity="0.55"/>
    <path d="M288 168C291 196 291 224 290 250" stroke="#0A0F1F" stroke-width="9" opacity="0.55"/>
    <rect x="190" y="250" width="132" height="44" rx="14" fill="url(#qmetal)" stroke="#0A0F1F" stroke-width="8"/>
    <path d="M190 294L190 330C190 356 206 366 226 366L286 366C306 366 322 356 322 330L322 294" fill="#E8F1FF" stroke="#0A0F1F" stroke-width="8"/>
  </g>
  <circle cx="238" cy="330" r="10" fill="#0A0F1F"/>
  <circle cx="274" cy="330" r="10" fill="#0A0F1F"/>
  <!-- mitts -->
  <g stroke="#F4B860" stroke-width="12" stroke-linecap="round">
    <rect x="104" y="262" width="48" height="92" rx="20"/>
    <rect x="360" y="262" width="48" height="92" rx="20"/>
  </g>
  <text x="256" y="462" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="5">2549</text>
</svg>
