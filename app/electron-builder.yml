appId: com.homegrowncode.qrscout
productName: QR Scout
copyright: Copyright © 2026 Team 2549 Millerbots
# Stable file names (no version) so the site's download links can point at
# releases/latest/download/<name> forever.
artifactName: 'QRScout-${os}-${arch}.${ext}'
directories:
  output: ../dist-app
files:
  - main.js
  - package.json
  - ../index.html
  - ../manifest.webmanifest
  - ../sw.js
  - ../assets/**
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QR Scout
  installerIcon: ../assets/images/millerbot-orange.png
  uninstallerIcon: ../assets/images/millerbot-orange.png
  license: ../LICENSE
  installerHeader: ../assets/images/millerbot-orange.png
  differentialPackage: true
  include: assets/installer.nsh
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # Unsigned on purpose — no signing certificates in this repo.
  identity: null
  hardenedRuntime: false
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Team 2549 Millerbots <noreply@example.com>
  synopsis: QR Scout Online desktop shell
extra:
  icon: ../assets/images/millerbot-orange.png
  shareable: true