name: Build desktop + mobile apps

# Builds the Electron desktop shells + Capacitor mobile shells and attaches
# every installer to a GitHub Release when a v* tag is pushed. The site's App
# tab links to releases/latest/download/<stable-name>, so file names must stay
# stable (see artifactName in app/electron-builder.yml, and the mobile renames
# below). Desktop builds are unsigned; the Android APK is unsigned (sideload);
# the iPhone .ipa is unsigned (sideload via AltStore/Sideloadly — no paid
# Apple Developer account needed to build it).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        # ubuntu-24.04 runners ship without FUSE, which the AppImage
        # tooling (linuxdeploy/appimagetool) normally needs to mount.
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      - name: Build installers
        env:
          # No signing certificates in this repo — skip macOS signing lookups.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Without FUSE, AppImage tools must extract-and-run instead of mount.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          case "${{ runner.os }}" in
            Windows) npx electron-builder --win nsis --x64 --arm64 2>&1 | tee build.log ;;
            macOS)   npx electron-builder --mac dmg zip --x64 --arm64 2>&1 | tee build.log ;;
            Linux)   npx electron-builder --linux AppImage deb --x64 --arm64 2>&1 | tee build.log ;;
          esac

      - name: Normalize Linux artifact names
        if: runner.os == 'Linux'
        # electron-builder names Linux x64 artifacts x86_64 (Debian style) and
        # amd64 (deb). The site's download links use stable x64 names.
        # Node-based rename from GITHUB_WORKSPACE (absolute paths, no shell
        # globbing/sed) so the step cannot fail on the runner's tooling.
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = process.env.GITHUB_WORKSPACE;
            const dir = path.join(root, "dist-app");
            for (const entry of fs.readdirSync(dir)) {
              const m = entry.match(/^QRScout-linux-(x86_64|amd64)\.(AppImage|deb)$/);
              if (m) {
                const target = `QRScout-linux-x64${m[2]}`;
                fs.renameSync(path.join(dir, entry), path.join(dir, target));
                console.log(`renamed ${entry} -> ${target}`);
              }
            }
          '

      - name: Publish build log to ci-debug branch (on failure)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug-repo
          mkdir -p debug-repo/ci-logs
          cp build.log "debug-repo/ci-logs/${RUNNER_OS}-build.log" 2>/dev/null || echo "no build.log" > "debug-repo/ci-logs/${RUNNER_OS}-build.log"
          cd debug-repo
          git config user.name "ci-debug-bot"
          git config user.email "ci-debug-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci logs: ${RUNNER_OS} run ${GITHUB_RUN_ID}" --allow-empty
          git push origin HEAD:ci-debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-${{ runner.os }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.AppImage
            dist-app/*.deb
          if-no-files-found: error

  mobile-android:
    name: Build Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (Gradle needs a JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor shell
        run: npx cap sync android

      - name: Build unsigned APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to stable name
        run: |
          mkdir -p dist-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/QRScout-android.apk
          ls -la dist-mobile

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-Android
          path: dist-mobile/*.apk
          if-no-files-found: error

  mobile-ios:
    name: Build iPhone app (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor shell
        run: npx cap sync ios

      - name: Build unsigned .ipa (no signing identity)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p Payload dist-mobile
          cp -R "$APP_PATH" Payload/
          zip -r -y dist-mobile/QRScout-iphone.ipa Payload
          rm -rf Payload
          ls -la dist-mobile

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-iOS
          path: dist-mobile/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build, mobile-android, mobile-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List installers
        run: ls -la artifacts

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true