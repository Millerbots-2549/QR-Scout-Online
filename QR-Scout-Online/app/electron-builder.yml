appId: com.homegrowncode.qrscout
productName: Fieldnotes
copyright: Copyright © 2026 Team 2549 Millerbots
# Stable file names (no version) so the site's download links can point at
# releases/latest/download/<name> forever.
artifactName: 'Fieldnotes-${os}-${arch}.${ext}'
directories:
  output: ../dist-app
files:
  - main.js
  - package.json
extraResources:
  - from: ../../index.html
    to: index.html
  - from: ../../scout.html
    to: scout.html
  - from: ../../guide.html
    to: guide.html
  - from: ../../apps.html
    to: apps.html
  - from: ../../feedback.html
    to: feedback.html
  - from: ../../site.css
    to: site.css
  - from: ../../site.js
    to: site.js
  - from: ../../scout.js
    to: scout.js
  - from: ../../qrcode.min.js
    to: qrcode.min.js
  - from: ../../default-config.json
    to: default-config.json
  - from: ../../manifest.webmanifest
    to: manifest.webmanifest
  - from: ../../sw.js
    to: sw.js
  - from: ../../assets
    to: assets
win:
  target:
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fieldnotes
  installerIcon: ../../assets/images/icon-512.png
  uninstallerIcon: ../../assets/images/icon-512.png
  installerHeader: ../../assets/images/icon-512.png
  differentialPackage: true
icon: ../../assets/images/icon-512.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # Unsigned on purpose — no signing certificates in this repo.
  identity: null
  hardenedRuntime: false
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Team 2549 Millerbots <noreply@example.com>
  synopsis: QR Scout Online desktop shell